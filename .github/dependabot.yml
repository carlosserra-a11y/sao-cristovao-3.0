# Atualizações automáticas de dependências (a maior parte dos ataques a sites
# vem de bibliotecas desatualizadas). Cada atualização abre um PR que passa
# por lint + testes antes de entrar.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
