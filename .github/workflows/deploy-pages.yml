# Publica a versão estática (frontend) no GitHub Pages a cada push na main.
# O backend Express/Gemini não roda no Pages: lá o chat e o estúdio usam as
# respostas de contingência locais (shared/aiFallback.ts).
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_STATIC_SITE: 'true'
          # Configuráveis em Settings → Secrets and variables → Actions → Variables
          # (valores públicos: vão para o site; nunca coloque segredos aqui).
          VITE_STORE_WHATSAPP_NUMBER: ${{ vars.STORE_WHATSAPP_NUMBER }}
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
